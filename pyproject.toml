[project]
name = "whoop-poc"
version = "0.1.0"
description = "Heart rate + approximate sleep from a local NOOP whoop.db (WHOOP 4.0 on Linux)"
requires-python = ">=3.10"
dependencies = ["textual>=0.80"]

[project.scripts]
whoop-poc = "whoop_poc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["whoop_poc.py", "tui.py", "coach.py", "workout_detail.py"]
